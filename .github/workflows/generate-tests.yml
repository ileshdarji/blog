name: "QA Gen — AI Test Generator"

on:
  workflow_dispatch:
    inputs:
      feature:
        description: "Feature or user story to generate tests for"
        required: true
        type: string
        default: "e.g. User can log in with email and password"
      url:
        description: "URL the tests should navigate to (optional)"
        required: false
        type: string
      test_dir:
        description: "Path to existing Playwright tests (to learn patterns from)"
        required: false
        default: "tests"
        type: string
      output_dir:
        description: "Where to write generated tests"
        required: false
        default: "tests/generated"
        type: string
      model:
        description: "Claude model to use"
        required: false
        default: "claude-sonnet-4-6"
        type: choice
        options:
          - claude-sonnet-4-6
          - claude-haiku-4-5-20251001
          - claude-opus-4-8

jobs:
  generate:
    name: Generate Playwright Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ai-test-gen/package.json

      - name: Install qa-gen dependencies
        working-directory: ai-test-gen
        run: npm install

      - name: Run qa-gen
        working-directory: ai-test-gen
        run: |
          node --loader tsx/esm src/index.ts generate \
            --feature "${{ github.event.inputs.feature }}" \
            ${{ github.event.inputs.url != '' && format('--url "{0}"', github.event.inputs.url) || '' }} \
            --test-dir "../${{ github.event.inputs.test_dir }}" \
            --output  "../${{ github.event.inputs.output_dir }}" \
            --model   "${{ github.event.inputs.model }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Check for generated files
        id: check
        run: |
          if [ -n "$(git status --porcelain '${{ github.event.inputs.output_dir }}')" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No files were generated or all files already exist."
          fi

      - name: Create pull request with generated tests
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "test(ai-gen): generate tests for ${{ github.event.inputs.feature }}"
          title: "🤖 AI-generated tests: ${{ github.event.inputs.feature }}"
          body: |
            ## AI-Generated Playwright Tests

            Generated by **qa-gen** — the AI test generator from [QA with Ilesh](https://ileshdarji.com).

            | | |
            |---|---|
            | **Feature** | ${{ github.event.inputs.feature }} |
            | **URL** | ${{ github.event.inputs.url || '—' }} |
            | **Test directory scanned** | `${{ github.event.inputs.test_dir }}` |
            | **Output directory** | `${{ github.event.inputs.output_dir }}` |
            | **Model** | `${{ github.event.inputs.model }}` |
            | **Triggered by** | @${{ github.actor }} |

            ---

            ### ⚠️ Review Checklist

            Before merging this PR, please verify:

            - [ ] Selectors are correct for your actual application
            - [ ] Test data (emails, passwords, IDs) is appropriate for your test environment
            - [ ] Assertions match the real expected behaviour
            - [ ] Tests pass locally: `npx playwright test ${{ github.event.inputs.output_dir }}`
            - [ ] No sensitive data is hardcoded

            ---

            > AI-generated tests are a starting point, not a finished product.
            > A human QA engineer should always review before merging.
          branch: "ai-tests/${{ github.run_id }}"
          delete-branch: true
          labels: "ai-generated, needs-review"
